<?xml version="1.0" encoding="UTF-8"?>
<svg width="64" height="64" viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg">
  <!-- VirtualPortManager App Icon - Port Pairs with Virtual Bridge -->

  <!-- Solid background - rounded square (same as Router) -->
  <rect x="2" y="2" width="60" height="60" rx="12" fill="#2d3748"/>

  <!-- Subtle inner shadow effect -->
  <rect x="4" y="4" width="56" height="56" rx="10" fill="none" stroke="#1a202c" stroke-width="1" opacity="0.5"/>

  <!-- Layer 1: Left Serial Port (DB9 style) -->
  <!-- Port body -->
  <path d="M 8 24 L 8 40 L 20 40 L 22 36 L 22 28 L 20 24 Z" fill="none" stroke="#e2e1e1" stroke-width="2.5"/>
  <!-- Port connector face -->
  <path d="M 20 24 L 22 28 L 22 36 L 20 40" fill="#5ba3e0" opacity="0.2"/>

  <!-- Pin holes (5 top, 4 bottom - DB9 style) -->
  <g fill="#e2e1e1">
    <circle cx="12" cy="28" r="1.2"/>
    <circle cx="15" cy="28" r="1.2"/>
    <circle cx="18" cy="28" r="1.2"/>
    <circle cx="13.5" cy="32" r="1.2"/>
    <circle cx="16.5" cy="32" r="1.2"/>
    <circle cx="12" cy="36" r="1.2"/>
    <circle cx="15" cy="36" r="1.2"/>
    <circle cx="18" cy="36" r="1.2"/>
  </g>

  <!-- Layer 2: Right Serial Port (DB9 style - mirrored) -->
  <!-- Port body -->
  <path d="M 56 24 L 56 40 L 44 40 L 42 36 L 42 28 L 44 24 Z" fill="none" stroke="#e2e1e1" stroke-width="2.5"/>
  <!-- Port connector face -->
  <path d="M 44 24 L 42 28 L 42 36 L 44 40" fill="#5ba3e0" opacity="0.2"/>

  <!-- Pin holes (5 top, 4 bottom - DB9 style) -->
  <g fill="#e2e1e1">
    <circle cx="52" cy="28" r="1.2"/>
    <circle cx="49" cy="28" r="1.2"/>
    <circle cx="46" cy="28" r="1.2"/>
    <circle cx="50.5" cy="32" r="1.2"/>
    <circle cx="47.5" cy="32" r="1.2"/>
    <circle cx="52" cy="36" r="1.2"/>
    <circle cx="49" cy="36" r="1.2"/>
    <circle cx="46" cy="36" r="1.2"/>
  </g>

  <!-- Layer 3: Virtual Bridge Connection -->
  <!-- Dashed/virtual connection lines -->
  <line x1="22" y1="28" x2="28" y2="28" stroke="#5ba3e0" stroke-width="2.5" stroke-dasharray="3,2" stroke-linecap="round" opacity="0.8"/>
  <line x1="22" y1="32" x2="28" y2="32" stroke="#5ba3e0" stroke-width="2.5" stroke-dasharray="3,2" stroke-linecap="round" opacity="0.8"/>
  <line x1="22" y1="36" x2="28" y2="36" stroke="#5ba3e0" stroke-width="2.5" stroke-dasharray="3,2" stroke-linecap="round" opacity="0.8"/>

  <line x1="36" y1="28" x2="42" y2="28" stroke="#5ba3e0" stroke-width="2.5" stroke-dasharray="3,2" stroke-linecap="round" opacity="0.8"/>
  <line x1="36" y1="32" x2="42" y2="32" stroke="#5ba3e0" stroke-width="2.5" stroke-dasharray="3,2" stroke-linecap="round" opacity="0.8"/>
  <line x1="36" y1="36" x2="42" y2="36" stroke="#5ba3e0" stroke-width="2.5" stroke-dasharray="3,2" stroke-linecap="round" opacity="0.8"/>

  <!-- Layer 4: Central Bridge/Link Symbol -->
  <!-- Outer bridge structure -->
  <rect x="27" y="22" width="10" height="20" rx="2" fill="none" stroke="#e2e1e1" stroke-width="2.5"/>

  <!-- Virtual indicator glow -->
  <rect x="28" y="23" width="8" height="18" rx="1.5" fill="#5ba3e0" opacity="0.15"/>

  <!-- Bidirectional arrows (showing virtual pairing) -->
  <!-- Arrow pointing right -->
  <path d="M 29 30 L 32 30 L 31 29 M 32 30 L 31 31" stroke="#5ba3e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Arrow pointing left -->
  <path d="M 35 34 L 32 34 L 33 33 M 32 34 L 33 35" stroke="#5ba3e0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Central hub indicator -->
  <circle cx="32" cy="32" r="2.5" fill="#5ba3e0"/>
  <circle cx="32" cy="32" r="1" fill="#ffffff"/>

  <!-- Layer 5: Details and accents -->
  <!-- Port labels/indicators -->
  <circle cx="10" cy="22" r="1.5" fill="#5ba3e0" opacity="0.7"/>
  <circle cx="54" cy="22" r="1.5" fill="#5ba3e0" opacity="0.7"/>

  <!-- Status indicators (active connection) -->
  <circle cx="10" cy="42" r="1.5" fill="#5ba3e0"/>
  <circle cx="54" cy="42" r="1.5" fill="#5ba3e0"/>

  <!-- Corner accent dots for detail (matching Router style) -->
  <circle cx="10" cy="10" r="1.2" fill="#5ba3e0" opacity="0.5"/>
  <circle cx="54" cy="10" r="1.2" fill="#5ba3e0" opacity="0.5"/>
  <circle cx="10" cy="54" r="1.2" fill="#5ba3e0" opacity="0.5"/>
  <circle cx="54" cy="54" r="1.2" fill="#5ba3e0" opacity="0.5"/>
</svg>
