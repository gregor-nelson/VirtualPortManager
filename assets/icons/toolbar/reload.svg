<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- RELOAD/RESTART - Dual Rotation - Rich Two-Tone Design -->

  <!-- Layer 1: White rotation path (counterclockwise, top-left) -->
  <path d="M 8 16 A 8 8 0 0 1 16 8" fill="none" stroke="#e2e1e1" stroke-width="2" stroke-linecap="round"/>
  <path d="M 8 12 L 8 16 L 12 16" fill="none" stroke="#e2e1e1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Path indicator dots (top-left arc) -->
  <circle cx="8" cy="16" r="1" fill="#e2e1e1" opacity="0.5"/>
  <circle cx="11" cy="10" r="1" fill="#e2e1e1" opacity="0.5"/>
  <circle cx="16" cy="8" r="1" fill="#e2e1e1" opacity="0.5"/>

  <!-- Layer 2: Blue rotation path (clockwise, bottom-right) -->
  <path d="M 24 16 A 8 8 0 0 1 16 24" fill="none" stroke="#4f90cd" stroke-width="2.5" stroke-linecap="round"/>
  <path d="M 24 20 L 24 16 L 20 16" fill="#4f90cd" stroke="none"/>

  <!-- Motion blur echoes -->
  <path d="M 22 18 A 8 8 0 0 1 18 22" fill="none" stroke="#4f90cd" stroke-width="2" stroke-linecap="round" opacity="0.3"/>
  <path d="M 23 17 A 8 8 0 0 1 20 21" fill="none" stroke="#4f90cd" stroke-width="1.5" stroke-linecap="round" opacity="0.2"/>

  <!-- Path indicator dots (bottom-right arc) -->
  <circle cx="24" cy="16" r="1" fill="#4f90cd" opacity="0.5"/>
  <circle cx="21" cy="22" r="1" fill="#4f90cd" opacity="0.5"/>
  <circle cx="16" cy="24" r="1" fill="#4f90cd" opacity="0.5"/>

  <!-- Layer 3: Details -->
  <!-- Central hub -->
  <circle cx="16" cy="16" r="4" fill="none" stroke="#e2e1e1" stroke-width="1.5"/>
  <circle cx="16" cy="16" r="2" fill="#4f90cd"/>

  <!-- Inner rotation indicators -->
  <circle cx="16" cy="16" r="6" fill="none" stroke="#e2e1e1" stroke-width="0.8" opacity="0.4"/>

  <!-- Directional tick marks -->
  <line x1="16" y1="10" x2="16" y2="12" stroke="#e2e1e1" stroke-width="1" opacity="0.6"/>
  <line x1="22" y1="16" x2="20" y2="16" stroke="#4f90cd" stroke-width="1" opacity="0.6"/>
  <line x1="16" y1="22" x2="16" y2="20" stroke="#4f90cd" stroke-width="1" opacity="0.6"/>
  <line x1="10" y1="16" x2="12" y2="16" stroke="#e2e1e1" stroke-width="1" opacity="0.6"/>
</svg>
