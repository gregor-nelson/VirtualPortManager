<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- UNINSTALL/DELETE - Trash Can with X - Rich Two-Tone Design -->

  <!-- Layer 1: White trash structure -->
  <!-- Trash can body -->
  <path d="M 10 12 L 11 28 L 21 28 L 22 12 Z" fill="none" stroke="#e2e1e1" stroke-width="1.5"/>

  <!-- Trash can lid -->
  <rect x="8" y="10" width="16" height="2" rx="1" fill="none" stroke="#e2e1e1" stroke-width="1.5"/>

  <!-- Handle on lid -->
  <path d="M 13 10 L 13 8 L 19 8 L 19 10" fill="none" stroke="#e2e1e1" stroke-width="1.5"/>

  <!-- Vertical divider lines inside trash -->
  <line x1="13" y1="15" x2="12.5" y2="25" stroke="#e2e1e1" stroke-width="1" opacity="0.4"/>
  <line x1="16" y1="15" x2="16" y2="25" stroke="#e2e1e1" stroke-width="1" opacity="0.4"/>
  <line x1="19" y1="15" x2="19.5" y2="25" stroke="#e2e1e1" stroke-width="1" opacity="0.4"/>

  <!-- Shadow/base -->
  <ellipse cx="16" cy="28.5" rx="6" ry="1" fill="#e2e1e1" opacity="0.3"/>

  <!-- Layer 2: Blue X mark (deletion indicator) -->
  <!-- X diagonal lines -->
  <line x1="22" y1="4" x2="28" y2="10" stroke="#4f90cd" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="28" y1="4" x2="22" y2="10" stroke="#4f90cd" stroke-width="2.5" stroke-linecap="round"/>

  <!-- X circle background (subtle) -->
  <circle cx="25" cy="7" r="5" fill="none" stroke="#4f90cd" stroke-width="1.5" opacity="0.3"/>

  <!-- Layer 3: Details -->
  <!-- Deletion particles -->
  <circle cx="24" cy="15" r="0.8" fill="#4f90cd" opacity="0.5"/>
  <circle cx="26" cy="13" r="0.6" fill="#4f90cd" opacity="0.4"/>
  <circle cx="27" cy="16" r="0.7" fill="#4f90cd" opacity="0.3"/>

  <!-- Warning indicator -->
  <circle cx="6" cy="20" r="1.5" fill="none" stroke="#e2e1e1" stroke-width="1"/>
  <line x1="6" y1="18" x2="6" y2="19.5" stroke="#e2e1e1" stroke-width="1" stroke-linecap="round" opacity="0.6"/>
  <circle cx="6" cy="20.8" r="0.3" fill="#e2e1e1" opacity="0.6"/>
</svg>
