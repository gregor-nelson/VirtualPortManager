<?xml version="1.0" encoding="UTF-8"?>
<svg width="32" height="32" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- PREINSTALL/DOWNLOAD - Arrow Down with Cloud - Rich Two-Tone Design -->

  <!-- Layer 1: White cloud structure -->
  <!-- Cloud outline -->
  <path d="M 12 10 Q 12 7 15 7 Q 17 5 19 7 Q 22 7 22 10 Q 24 10 24 12 Q 24 14 22 14 L 12 14 Q 10 14 10 12 Q 10 10 12 10 Z"
        fill="none" stroke="#e2e1e1" stroke-width="1.5"/>

  <!-- Cloud details -->
  <circle cx="14" cy="10" r="1" fill="#e2e1e1" opacity="0.3"/>
  <circle cx="18" cy="9" r="1.2" fill="#e2e1e1" opacity="0.4"/>
  <circle cx="20" cy="11" r="0.8" fill="#e2e1e1" opacity="0.3"/>

  <!-- Layer 2: Blue download arrow (active) -->
  <!-- Arrow shaft -->
  <rect x="14.5" y="13" width="3" height="11" rx="1.5" fill="#4f90cd"/>

  <!-- Arrow head pointing down -->
  <path d="M 16 28 L 11 20 L 21 20 Z" fill="#4f90cd"/>

  <!-- Glow effect around arrow -->
  <rect x="14" y="12.5" width="4" height="12" rx="2" fill="none" stroke="#4f90cd" stroke-width="1.5" opacity="0.15"/>

  <!-- Layer 3: Details -->
  <!-- Download target/platform -->
  <rect x="7" y="27" width="18" height="2" rx="1" fill="none" stroke="#e2e1e1" stroke-width="1.5"/>

  <!-- Motion particles falling -->
  <circle cx="10" cy="16" r="0.8" fill="#4f90cd" opacity="0.5"/>
  <circle cx="12" cy="19" r="0.7" fill="#4f90cd" opacity="0.4"/>
  <circle cx="20" cy="17" r="0.9" fill="#4f90cd" opacity="0.5"/>
  <circle cx="22" cy="20" r="0.6" fill="#4f90cd" opacity="0.3"/>
  <circle cx="18" cy="23" r="0.7" fill="#4f90cd" opacity="0.4"/>

  <!-- Speed lines -->
  <line x1="10" y1="22" x2="9" y2="25" stroke="#4f90cd" stroke-width="1" opacity="0.3" stroke-linecap="round"/>
  <line x1="22" y1="22" x2="23" y2="25" stroke="#4f90cd" stroke-width="1" opacity="0.3" stroke-linecap="round"/>

  <!-- Progress indicator dots -->
  <circle cx="6" cy="4" r="1.2" fill="none" stroke="#e2e1e1" stroke-width="1"/>
  <circle cx="26" cy="4" r="1.2" fill="#4f90cd"/>
</svg>
